<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Tramano Creative">
  <!--
    Compact cut of the TC monogram, for favicon sizes.

    Same construction as public/logo.svg but with every stroke roughly 25%
    heavier and the composition tightened. At 16px a stroke drawn at display
    weight lands under one pixel and greys out; this cut keeps each limb at
    or above a whole pixel so the T and the C still separate in a tab strip.

    Display weight lives in public/logo.svg — use that anywhere the mark is
    rendered above about 64px.
  -->
  <rect width="512" height="512" fill="#0c0c0d"/>

  <!-- C — aperture facing right, sitting clear of the crossbar -->
  <path
    d="M 378 226 A 112 112 0 1 0 378 398"
    fill="none"
    stroke="#f5f4f2"
    stroke-width="56"
    stroke-linecap="butt"
  />

  <!-- Knockout reaching past the arc's leftmost point (306 − 112 − 28 = 166) -->
  <rect x="128" y="144" width="128" height="330" fill="#0c0c0d"/>

  <!-- T — crossbar with angled cuts, then the stem -->
  <path d="M 84 88 L 428 88 L 404 152 L 60 152 Z" fill="#f5f4f2"/>
  <rect x="188" y="152" width="56" height="300" fill="#f5f4f2"/>
</svg>
