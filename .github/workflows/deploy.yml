name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Daily rebuild at 06:00 UTC (09:00 Beirut).
  #
  # Blog posts publish by date — see getAllPosts in src/lib/blog.ts. A post
  # dated in the future isn't built at all, so it needs a build to happen on or
  # after its date to appear. Without this schedule, a post dated for next
  # Tuesday sits unpublished until someone pushes something unrelated.
  #
  # Deleting this line silently breaks scheduled publishing. It won't error;
  # posts just never appear.
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Lint and typecheck gate the deploy rather than running after it. Both
      # pass today; without a step here nothing stops a future commit from
      # shipping while they don't. `next build` runs tsc over the app, but not
      # over files no route imports.
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
      - uses: actions/configure-pages@v6
      # upload-artifact isn't listed here, but upload-pages-artifact wraps it —
      # so bumping this is what moves that off its deprecated Node runtime too.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
